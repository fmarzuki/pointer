[package]
name = "pointer"
version = "0.4.0"
edition = "2024"
description = "Laser pointer, spotlight, and annotation overlay for presentations and screen sharing"
authors = ["Farkhan Marzuki <farkhan.marzuki@unsoed.ac.id>"]
license-file = "LICENSE"
repository = "https://github.com/fmarzuki/pointer"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
global-hotkey = "0.8.0"
interprocess = "2.4.4"
serde = { version = "1.0.229", features = ["derive"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
tiny-skia = "0.11"
toml = "1.1.7"
ttf-parser = "0.25.1"
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", features = ["global_shortcuts"] }
futures-util = "0.3.34"
ksni = { version = "0.3.6", features = ["blocking"] }
tokio = { version = "1.53.2", features = ["rt", "macros"] }

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
name = "pointer"
section = "utils"
priority = "optional"
extended-description = """\
Transparent overlay for presentations: laser pointer with trail, spotlight, click \
highlight, radial menu, and annotations (pen, highlighter, box, arrow, ellipse). \
Effects are visible when sharing the full screen."""
# libX11/libxcb/xkbcommon dimuat lewat dlopen sehingga tidak terdeteksi $auto.
depends = "$auto, libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6, libxrandr2, libxkbcommon-x11-0"
recommends = "xdg-desktop-portal, gnome-shell-extension-appindicator"
assets = [
    ["target/release/pointer", "usr/bin/", "755"],
    ["packaging/linux/io.github.fmarzuki.Pointer.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/io.github.fmarzuki.Pointer.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/pointer/README.md", "644"],
    ["assets/fonts/OFL.txt", "usr/share/doc/pointer/OFL-NotoSans.txt", "644"],
]
